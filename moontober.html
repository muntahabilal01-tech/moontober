<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moontober 2026</title>
<style>
:root{--bg:#120F0E;--card:#1B1716;--or:#FF5A1F;--pk:#FF4FA3;--cr:#F3E9DC;--mu:#8F837A;--dim:#4A2416;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--cr);font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;max-width:900px;margin:0 auto;padding:18px 14px 60px}
.sub{color:var(--pk);letter-spacing:.5em;font-weight:700;font-size:13px;text-align:center;margin-top:8px}
h1{margin:0;text-align:center;color:var(--or);font-size:clamp(38px,12vw,76px);letter-spacing:-1px;line-height:1}
.tag{text-align:center;color:var(--mu);font-size:13px;margin:6px 0 16px}
.prog{background:var(--card);border:1px solid var(--or);border-radius:10px;padding:12px;margin-bottom:8px}
.bar{height:10px;background:var(--dim);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--or),var(--pk));width:0;transition:width .4s}
.stats{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--or)}
.msg{color:var(--pk);font-weight:700;text-align:center;margin:10px 0;min-height:18px;font-size:14px}
h2{color:var(--or);font-size:13px;letter-spacing:.12em;margin:26px 0 2px}
h3{margin:0 0 10px;font-size:22px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.c{background:var(--card);border:1px solid var(--or);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:5px;text-align:center;position:relative}
.c.tn{box-shadow:0 0 0 2px var(--pk)}
.c.done{border-color:var(--pk);background:#241519}
.d{display:flex;justify-content:space-between;font-size:10px;font-weight:700;color:var(--mu)}
.d b{color:var(--or)}
.em{height:84px}.em svg{width:84px;height:84px}.em path{fill:none;stroke-linecap:round;stroke-linejoin:round}.em .o{stroke:var(--or)}.em .p{stroke:var(--pk)}.em .fo{fill:var(--or)}.em .fp{fill:var(--pk)}
.t{font-weight:800;font-size:14px;min-height:34px}
.c.done .t{text-decoration:line-through;text-decoration-color:var(--pk)}
.dr{font-size:10px;color:var(--mu)}
.bd{align-self:center;font-size:9px;font-weight:800;padding:2px 9px;border-radius:9px;border:1px solid var(--or);color:var(--or)}
.bd.r{background:var(--pk);border-color:var(--pk);color:var(--bg)}
.bd.f{border-color:var(--pk);color:var(--pk)}
.b{font:inherit;font-size:12px;font-weight:700;border:1.5px solid var(--pk);background:none;color:var(--cr);border-radius:7px;padding:9px 6px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.b.on{background:var(--pk);color:var(--bg)}
.b.e{border-color:var(--or);font-size:10px}
.b.e.on{background:var(--or)}
.n{background:var(--or);color:var(--bg);border-radius:8px;padding:12px;font-weight:800;font-size:13px;margin-top:10px}
.rs{display:block;margin:30px auto 0;background:none;border:1px solid var(--dim);color:var(--mu);border-radius:8px;padding:8px 14px;font-size:12px;cursor:pointer}
</style></head><body>

const DN=["SUN","MON","TUE","WED","THU","FRI","SAT"];
function ep(d){return d<=13?["HILL HOUSE",d-3]:d<=22?["BLY MANOR",d-13]:d<=30?["PENNY DREADFUL",d-22]:null}
let S={};try{S=JSON.parse(localStorage.getItem("moontober26")||"{}")}catch(e){}
function save(){try{localStorage.setItem("moontober26",JSON.stringify(S))}catch(e){}}
const nw=new Date(),TD=(nw.getFullYear()==2026&&nw.getMonth()==9)?nw.getDate():0;
function card(r){const d=r[0],e=ep(d),m=S["m"+d],x=S["e"+d];
return `<div class="c${m?" done":""}${d==TD?" tn":""}"><div class="d"><span>${DN[new Date(2026,9,d).getDay()]}</span><b>OCT ${d}</b></div><div class="em">${IC[r[4]]}</div><div class="t">${r[1]}</div><div class="dr">dir. ${r[2]}</div><div class="bd ${r[3]=="REWATCH"?"r":r[3]=="FINISH IT"?"f":""}">${r[3]}</div><button class="b${m?" on":""}" data-k="m${d}">${m?"✓ watched":"mark watched"}</button>${e?`<button class="b e${x?" on":""}" data-k="e${d}">${x?"✓ ":""}${e[0]} · EP ${e[1]}</button>`:`<div class="dr">movie only tonight</div>`}</div>`}
function render(){let h="";WK.forEach(w=>{h+=`<h2>${w[0]}</h2><h3>${w[1]}</h3><div class="g">`+D.filter(r=>r[0]>=w[2]&&r[0]<w[2]+7).map(card).join("")+`</div><div class="n">${w[3]}</div>`});
document.getElementById("app").innerHTML=h;
const mv=D.filter(r=>S["m"+r[0]]).length,eps=D.filter(r=>ep(r[0])&&S["e"+r[0]]).length;
document.getElementById("a").textContent=mv+" / 28 FILMS";document.getElementById("b").textContent=eps+" / 27 EPISODES";
document.getElementById("f").style.width=(mv/28*100)+"%";
document.getElementById("m").textContent=mv==28?"you survived Moontober. go touch grass (at night).":TD&&!S["m"+TD]&&TD>=4?"tonight: "+D.find(r=>r[0]==TD)[1]:""}
document.getElementById("app").addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(!b)return;const k=b.dataset.k;S[k]=!S[k];save();render()});
document.getElementById("rs").onclick=()=>{if(confirm("Clear all your ticks?")){S={};save();render()}};
render();
</script></body></html>
